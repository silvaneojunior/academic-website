name: Render and deploy R Markdown website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R Markdown
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown

      - name: Download OnlineSurr logo
        run: |
          mkdir -p assets
          curl --fail --location --retry 3             https://silvaneojunior.github.io/OnlineSurr/reference/figures/hex_badge.png             --output assets/onlinesurr-hex.png

      - name: Render website
        shell: Rscript {0}
        run: |
          rmarkdown::render_site()

      - name: Preserve custom domain
        run: |
          printf 'silvaneojunior.com\n' > docs/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload rendered website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
