      <ellipse cx="82" cy="1674" rx="13" ry="30" transform="rotate(-42 82 1674)"/>
      <ellipse cx="122" cy="1628" rx="11" ry="26" transform="rotate(-22 122 1628)"/>
    </g>
  </g>

  <!-- lower right terracotta accent -->
  <g opacity=".55">
    <path d="M1920 1925 C1868 1888 1818 1836 1774 1767" fill="none" stroke="#b45535" stroke-opacity=".08" stroke-width="2"/>
    <g fill="#b45535" fill-opacity=".055">
      <ellipse cx="1890" cy="1900" rx="12" ry="31" transform="rotate(52 1890 1900)"/>
      <ellipse cx="1858" cy="1868" rx="11" ry="28" transform="rotate(43 1858 1868)"/>
      <ellipse cx="1824" cy="1831" rx="10" ry="24" transform="rotate(34 1824 1831)"/>
    </g>
  </g>

  <!-- birds near upper/right whitespace -->
  <g fill="none" stroke="#17324d" stroke-opacity=".24" stroke-width="4" stroke-linecap="round">
    <path d="M1616 336 Q1631 322 1646 336 Q1661 322 1677 335"/>
    <path d="M1680 392 Q1692 381 1704 392 Q1717 380 1730 390"/>
    <path d="M1568 448 Q1578 439 1589 448 Q1600 438 1611 447"/>
  </g>

  <!-- birds lower right -->
  <g fill="none" stroke="#17324d" stroke-opacity=".18" stroke-width="3.6" stroke-linecap="round">
    <path d="M1650 1534 Q1661 1523 1674 1534 Q1687 1523 1698 1534"/>
    <path d="M1714 1592 Q1723 1583 1732 1592 Q1742 1582 1752 1591"/>
  </g>

  <!-- tiny bird lower left -->
  <g fill="none" stroke="#17324d" stroke-opacity=".14" stroke-width="3" stroke-linecap="round">
    <path d="M170 2006 Q178 1998 186 2006 Q194 1998 202 2005"/>
  </g>
</svg>
